<div class="app-shell">
  <!-- Main Content -->
  <div class="main-content">
    <router-outlet></router-outlet>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button
      class="nav-item"
      [class.active]="isActive('/tabs/vehicles')"
      (click)="navigateToVehicles()"
      aria-label="Vehicles"
    >
      <lucide-angular [img]="CarFrontIcon" [size]="36"></lucide-angular>
      <span class="nav-label">Vehicles</span>
    </button>

    <button class="nav-item nav-add" (click)="navigateToAdd()" aria-label="Add">
      <div class="add-circle">
        <lucide-angular [img]="PlusIcon" [size]="36"></lucide-angular>
      </div>
    </button>

    <button
      class="nav-item"
      [class.active]="isActive('/tabs/profile')"
      (click)="navigateToProfile()"
      aria-label="Profile"
    >
      <lucide-angular [img]="UserIcon" [size]="36"></lucide-angular>
      <span class="nav-label">Profile</span>
    </button>
  </nav>
</div>
