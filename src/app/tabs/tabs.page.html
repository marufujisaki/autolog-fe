<div class="app-shell">
  <!-- Main Content -->
  <div class="main-content">
    <router-outlet></router-outlet>
  </div>

  <!-- FAB Menu Overlay -->
  @if (fabMenuOpen) {
  <div class="fab-overlay" (click)="closeFabMenu()"></div>
  <div class="fab-options">
    <button
      class="fab-option"
      (click)="openAddVehicle()"
      [attr.aria-label]="'vehicles.addVehicle' | translate"
    >
      <lucide-angular [img]="CarIcon" [size]="36"></lucide-angular>
    </button>
    <button
      class="fab-option"
      (click)="openNewLog()"
      [attr.aria-label]="'maintenance.addLog' | translate"
    >
      <lucide-angular [img]="WrenchIcon" [size]="36"></lucide-angular>
    </button>
  </div>
  }

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button
      class="nav-item"
      [class.active]="isActive('/tabs/vehicles')"
      (click)="navigateToVehicles()"
      [attr.aria-label]="'tabs.vehicles' | translate"
    >
      <lucide-angular [img]="CarFrontIcon" [size]="36"></lucide-angular>
      <span class="nav-label">{{ 'tabs.vehicles' | translate }}</span>
    </button>

    <button
      class="nav-item nav-add"
      (click)="toggleFabMenu()"
      [attr.aria-label]="'common.add' | translate"
    >
      <div class="add-circle" [class.active]="fabMenuOpen">
        <lucide-angular [img]="PlusIcon" [size]="36"></lucide-angular>
      </div>
    </button>

    <button
      class="nav-item"
      [class.active]="isActive('/tabs/profile')"
      (click)="navigateToProfile()"
      [attr.aria-label]="'profile.title' | translate"
    >
      <lucide-angular [img]="UserIcon" [size]="36"></lucide-angular>
      <span class="nav-label">{{ 'profile.title' | translate }}</span>
    </button>
  </nav>

  <!-- Full-screen modals (no route change, underlying page stays mounted) -->
  @defer (when addVehicleModalOpen) { @if (addVehicleModalOpen) {
  <div
    class="page-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'vehicles.addVehicle' | translate"
  >
    <app-add-vehicle
      [presentedAsModal]="true"
      (dismissed)="closeAddVehicle()"
    ></app-add-vehicle>
  </div>
  } } @defer (when newLogModalOpen) { @if (newLogModalOpen) {
  <div
    class="page-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'maintenance.addLog' | translate"
  >
    <app-new-log
      [presentedAsModal]="true"
      (dismissed)="closeNewLog()"
    ></app-new-log>
  </div>
  } } @defer (when scanVehicleModalOpen) { @if (scanVehicleModalOpen) {
  <div
    class="page-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'share.scanTitle' | translate"
  >
    <app-scan-vehicle
      [presentedAsModal]="true"
      (dismissed)="closeScanVehicle()"
    ></app-scan-vehicle>
  </div>
  } }
</div>
