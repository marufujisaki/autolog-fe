<ion-card [ngClass]="{ selected: selected }">
  <div class="icon">
    @if (icon) {
    <lucide-angular [img]="icon" class="lucide-custom" [ngClass]="'color-' + iconColor"></lucide-angular>
    }
  </div>

  <ion-card-content class="body">
    <h4>{{ title }}</h4>
    <ng-content></ng-content>
  </ion-card-content>
</ion-card>
