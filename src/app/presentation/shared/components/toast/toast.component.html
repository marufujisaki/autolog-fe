<div
  class="app-toast"
  *ngIf="isVisible"
  [class.app-toast--success]="type === 'success'"
  [class.app-toast--error]="type === 'error'"
  [class.app-toast--warning]="type === 'warning'"
  [class.app-toast--info]="type === 'info'"
  role="status"
  aria-live="polite"
>
  <div class="app-toast__icon">
    <span>{{
      type === "success"
        ? "✓"
        : type === "error"
          ? "✕"
          : type === "warning"
            ? "⚠"
            : "ℹ"
    }}</span>
  </div>

  <div class="app-toast__content">
    {{ message }}
  </div>

  <button
    type="button"
    class="app-toast__close"
    aria-label="Dismiss"
    (click)="dismiss()"
  >
    ✕
  </button>
</div>
