<div class="app-select" [class.disabled]="disabled">
  <label *ngIf="label" class="app-select__label" [for]="selectId">{{
    label
  }}</label>

  <select
    class="app-select__control"
    [id]="selectId"
    [disabled]="disabled"
    [value]="value"
    [attr.aria-invalid]="errorMessage ? true : null"
    [attr.aria-describedby]="errorMessage ? selectId + '-error' : null"
    (change)="onSelectionChange($any($event.target).value)"
    (blur)="onBlur()"
  >
    <option value="" disabled hidden>{{ placeholder }}</option>
    <option
      *ngFor="let opt of options"
      [value]="opt.value"
      [disabled]="opt.disabled"
    >
      {{ opt.label }}
    </option>
  </select>

  <p *ngIf="errorMessage" class="app-select__error" [id]="selectId + '-error'">
    {{ errorMessage }}
  </p>
</div>
