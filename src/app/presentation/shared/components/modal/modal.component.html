<div class="app-modal" [class.open]="isOpen">
  <div class="app-modal__backdrop" (click)="onBackdropClick()"></div>

  <div class="app-modal__container" role="dialog" [attr.aria-modal]="true">
    <div class="app-modal__header" *ngIf="title">
      <h2 class="app-modal__title">{{ title }}</h2>
      <button
        type="button"
        class="app-modal__close"
        aria-label="Close modal"
        (click)="onCloseClick()"
      >
        ✕
      </button>
    </div>

    <div class="app-modal__content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
