<article class="app-empty-state" role="status" aria-live="polite">
  @if (iconData; as data) {
  <lucide-angular class="app-empty-state__icon" [img]="data" [size]="64"></lucide-angular>
  } @else {
  <div class="app-empty-state__icon">{{ iconText }}</div>
  }

  <h2 class="app-empty-state__title">{{ title() }}</h2>

  <p *ngIf="description() !== undefined" class="app-empty-state__description">
    {{ description() }}
  </p>

  <ng-content></ng-content>
</article>
