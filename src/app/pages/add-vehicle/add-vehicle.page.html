<div
  class="add-vehicle-page"
  appSwipeToDismiss
  [swipeHandleSelector]="'.page-header'"
  (swipeDismissed)="goBack()"
>
  <!-- Drag area: handle bar + title -->
  <header class="page-header">
    <div class="handle-bar" aria-hidden="true"></div>
    <h1 class="page-title">{{ 'vehicles.addVehicle' | translate }}</h1>
  </header>

  <!-- Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-section">
    <!-- Make (with autocomplete) -->
    <div class="form-group">
      <app-autocomplete
        [formControl]="brandControl"
        [label]="'vehicles.brand' | translate"
        placeholder="Chevrolet"
        [searchFn]="searchMakes"
        (optionSelected)="onMakeSelected($event)"
      ></app-autocomplete>
    </div>

    <!-- Model (with autocomplete, depends on selected make) -->
    <div class="form-group">
      <app-autocomplete
        [formControl]="modelControl"
        [label]="'vehicles.model' | translate"
        placeholder="Aveo"
        [searchFn]="searchModels"
      ></app-autocomplete>
    </div>

    <div class="form-row">
      <div class="form-group form-group--short">
        <app-input
          [formControl]="yearControl!"
          type="text"
          placeholder="2022"
          [label]="'vehicles.year' | translate"
        ></app-input>
      </div>
      <div class="form-group form-group--medium">
        <app-input
          [formControl]="plateControl!"
          type="text"
          placeholder="AA453YR"
          [label]="'vehicles.licensePlate' | translate"
        ></app-input>
      </div>
    </div>

    <div class="form-group">
      <app-input
        [formControl]="colorControl!"
        type="text"
        placeholder="Blue"
        [label]="'vehicles.color' | translate"
      ></app-input>
    </div>

    <div class="form-group">
      <app-input
        [formControl]="displayNameControl!"
        type="text"
        placeholder="Chile Van 2"
        [label]="'vehicles.displayName' | translate"
      ></app-input>
    </div>

    <!-- Card Color Selector -->
    <div class="card-color-section">
      <label class="card-color-label">{{ 'vehicles.cardColor' | translate }}</label>
      <div class="card-color-picker">
        @for (c of cardColorOptions; track c) {
        <span
          class="card-color-dot"
          [style.background]="c"
          [class.selected]="form.get('cardColor')?.value === c"
          (click)="selectCardColor(c)"
        ></span>
        }
      </div>
    </div>

    <div class="button-section">
      <app-button
        variant="primary"
        type="submit"
        [fullWidth]="true"
        [disabled]="!form.valid || isLoading"
      >
        {{ 'common.add' | translate }}
      </app-button>
    </div>
  </form>
</div>
