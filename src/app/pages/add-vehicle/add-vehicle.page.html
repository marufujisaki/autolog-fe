<div
  class="add-vehicle-page"
  appSwipeToDismiss
  [swipeHandleSelector]="'.page-header'"
  (swipeDismissed)="goBack()"
>
  <!-- Drag area: handle bar + title -->
  <header class="page-header">
    <div class="handle-bar" aria-hidden="true"></div>
    <h1 class="page-title">{{ 'vehicles.addVehicle' | translate }}</h1>
  </header>

  <!-- Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-section">
    <app-vehicle-form [formGroup]="form"></app-vehicle-form>

    <div class="button-section">
      <app-button
        variant="primary"
        type="submit"
        [fullWidth]="true"
        [disabled]="!form.valid || isLoading"
      >
        {{ 'common.add' | translate }}
      </app-button>
    </div>
  </form>
</div>
