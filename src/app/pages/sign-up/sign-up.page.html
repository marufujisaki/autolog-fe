<ion-content fullscreen [scrollY]="true">
  <ion-grid class="bottom">
    <ion-row class="input-row">
      <ion-col size="12">
        <h2 class="title">{{ 'auth.createAccount' | translate }}</h2>
        <div class="form-group">
          <app-input
            [formControl]="firstNameControl!"
            type="text"
            placeholder="Nombre Apellido"
            [label]="'auth.fullName' | translate"
            [errorMessage]="
              firstNameControl?.touched && firstNameControl?.hasError('required')
                ? ('validation.required' | translate)
                : undefined
            "
          ></app-input>
        </div>
        <div class="form-group">
          <app-input
            [formControl]="emailControl!"
            type="email"
            placeholder="mechanic@taller.com"
            [label]="'auth.email' | translate"
            [errorMessage]="
              emailControl?.touched && emailControl?.hasError('required')
                ? ('validation.required' | translate)
                : emailControl?.touched && emailControl?.hasError('email')
                  ? ('auth.invalidEmail' | translate)
                  : undefined
            "
          ></app-input>
        </div>
        <div class="form-group">
          <app-input
            [formControl]="lastNameControl!"
            type="tel"
            placeholder="+58233243"
            [label]="'auth.phone' | translate"
          ></app-input>
        </div>
        <div class="form-group">
          <app-input
            [formControl]="passwordControl!"
            type="password"
            placeholder="••••••••••••••"
            [label]="'auth.password' | translate"
            [errorMessage]="
              passwordControl?.touched && passwordControl?.hasError('required')
                ? ('validation.required' | translate)
                : passwordControl?.touched && passwordControl?.hasError('minlength')
                  ? ('auth.passwordTooShort' | translate)
                  : undefined
            "
          ></app-input>
        </div>
        <div class="form-group">
          <app-input
            [formControl]="confirmPasswordControl!"
            type="password"
            placeholder="••••••••••••••"
            [label]="'auth.confirmPassword' | translate"
            [errorMessage]="
              confirmPasswordControl?.touched && confirmPasswordControl?.hasError('required')
                ? ('validation.required' | translate)
                : undefined
            "
          ></app-input>
        </div>

        @if (errorMessage()) {
        <div class="error-alert">{{ errorMessage() | translate }}</div>
        }
      </ion-col>
    </ion-row>
    <ion-row class="button-row">
      <ion-col size="12">
        <app-button
          variant="primary"
          type="submit"
          [fullWidth]="true"
          [disabled]="!signUpForm.valid || isLoading()"
          (clicked)="onSubmit()"
        >
          {{ 'auth.signUp' | translate }}
        </app-button>
        <div class="divider">
          <span>{{ 'auth.or' | translate }}</span>
        </div>
        <button class="google-btn" type="button">
          <img src="assets/icon/google.svg" alt="Google" class="google-icon" />
          <span>{{ 'auth.continueWithGoogle' | translate }}</span>
        </button>
        <p>
          {{ 'auth.alreadyHaveAccount' | translate }}
          <a href="javascript:void(0)" (click)="navigateToLogin()" class="link"
            >{{ 'auth.login' | translate }}</a
          >
        </p>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
