<ion-content fullscreen [scrollY]="true">
  <ion-grid class="center">
    <ion-row class="input-row">
      <ion-col size="12">
        <h2 class="title">{{ 'auth.loginTitle' | translate }}<span class="text-blue">{{ 'auth.loginTitleHighlight' | translate }}</span></h2>
        <div class="form-group">
          <app-input
            [formControl]="emailControl!"
            type="email"
            placeholder="mechanic@taller.com"
            [label]="'auth.email' | translate"
            [errorMessage]="
              emailControl?.touched && emailControl?.hasError('required')
                ? ('validation.required' | translate)
                : emailControl?.touched && emailControl?.hasError('email')
                  ? ('auth.invalidEmail' | translate)
                  : undefined
            "
          ></app-input>
        </div>
        <div class="form-group">
          <app-input
            [formControl]="passwordControl!"
            type="password"
            placeholder="••••••••••••••"
            [label]="'auth.password' | translate"
            [errorMessage]="
              passwordControl?.touched && passwordControl?.hasError('required')
                ? ('validation.required' | translate)
                : passwordControl?.touched && passwordControl?.hasError('minlength')
                  ? ('auth.passwordTooShort' | translate)
                  : undefined
            "
          ></app-input>
        </div>
        <a
          href="javascript:void(0)"
          (click)="navigateToForgotPassword()"
          class="forgot-password-link"
        >
          {{ 'auth.forgotPassword' | translate }}
        </a>

        @if (errorMessage()) {
        <div class="error-alert">{{ errorMessage() | translate }}</div>
        }
      </ion-col>
    </ion-row>
    <ion-row class="button-row">
      <ion-col size="12">
        <app-button
          variant="primary"
          type="submit"
          [fullWidth]="true"
          [disabled]="!loginForm.valid || isLoading()"
          (clicked)="onSubmit()"
        >
          {{ 'auth.login' | translate }}
        </app-button>
        <app-google-signin-button
          (success)="onGoogleSuccess()"
          (signInError)="errorMessage.set($event)"
        ></app-google-signin-button>
        <p>
          {{ 'auth.noAccount' | translate }}
          <a href="javascript:void(0)" (click)="navigateToSignUp()" class="link"
            >{{ 'auth.signUp' | translate }}</a
          >
        </p>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
