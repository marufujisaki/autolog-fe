<div class="forgot-page">
  <!-- Back Button -->
  <button class="back-btn" (click)="goBack()" [attr.aria-label]="'common.back' | translate">
    <lucide-angular [img]="ChevronLeftIcon" [size]="24"></lucide-angular>
  </button>

  <!-- Centered Content -->
  <div class="page-content">
    <h1 class="page-title">{{ 'auth.forgotPassword' | translate }}</h1>
    <p class="page-subtitle">{{ 'auth.forgotPasswordSubtitle' | translate }}</p>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-section">
      <div class="form-group">
        <app-input
          [formControl]="emailControl!"
          type="email"
          placeholder="mechanic@taller.com"
          [label]="'auth.email' | translate"
          [errorMessage]="
            emailControl?.touched && emailControl?.hasError('required')
              ? ('validation.required' | translate)
              : emailControl?.touched && emailControl?.hasError('email')
                ? ('auth.invalidEmail' | translate)
                : undefined
          "
        ></app-input>
      </div>

      @if (errorKey()) {
      <p class="form-error" role="alert">{{ errorKey() | translate }}</p>
      }

      <div class="button-section">
        <app-button
          variant="primary"
          type="submit"
          [fullWidth]="true"
          [disabled]="!form.valid || isLoading()"
        >
          @if (isLoading()) { {{ 'common.loading' | translate }} } @else {
          {{ 'auth.sendCode' | translate }} }
        </app-button>
      </div>
    </form>

    <button
      type="button"
      class="resend-text"
      [disabled]="!form.valid || isLoading() || resendCooldown() > 0"
      (click)="resendCode()"
    >
      {{ 'auth.resendCode' | translate }}
      @if (resendCooldown() > 0) { ({{ resendCooldown() }}s) }
    </button>
  </div>
</div>
