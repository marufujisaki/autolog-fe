<div class="forgot-page">
  <!-- Back Button -->
  <button class="back-btn" (click)="goBack()" aria-label="Go back">
    <lucide-angular [img]="ChevronLeftIcon" [size]="24"></lucide-angular>
  </button>

  <!-- Title -->
  <h1 class="page-title">Forgot password</h1>
  <p class="page-subtitle">You will receive a code to reset your password.</p>

  <!-- Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-section">
    <div class="form-group">
      <app-input
        [formControl]="emailControl!"
        type="email"
        placeholder="mechanic@taller.com"
        label="Email"
        [errorMessage]="
          emailControl?.touched && emailControl?.hasError('required')
            ? 'Email is required'
            : emailControl?.touched && emailControl?.hasError('email')
              ? 'Enter a valid email'
              : undefined
        "
      ></app-input>
    </div>

    <div class="button-section">
      <app-button
        variant="primary"
        type="submit"
        [fullWidth]="true"
        [disabled]="!form.valid || isLoading"
      >
        Send code
      </app-button>
    </div>
  </form>

  <p class="resend-text">Resend code</p>
</div>
