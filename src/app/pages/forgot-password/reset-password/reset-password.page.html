<div class="reset-page">
  <!-- Back Button -->
  <button class="back-btn" (click)="goBack()" [attr.aria-label]="'common.back' | translate">
    <lucide-angular [img]="ChevronLeftIcon" [size]="24"></lucide-angular>
  </button>

  <!-- Title -->
  <h1 class="page-title">{{ 'auth.resetPassword' | translate }}</h1>
  <p class="page-subtitle">{{ 'auth.forgotPasswordSubtitle' | translate }}</p>

  <!-- Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-section">
    <div class="form-group">
      <app-input
        [formControl]="passwordControl!"
        type="password"
        placeholder="••••••••••••••"
        [label]="'auth.password' | translate"
        [errorMessage]="
          passwordControl?.touched && passwordControl?.hasError('required')
            ? ('validation.required' | translate)
            : passwordControl?.touched && passwordControl?.hasError('minlength')
              ? ('auth.passwordTooShort' | translate)
              : undefined
        "
      ></app-input>
    </div>

    <div class="form-group">
      <app-input
        [formControl]="confirmPasswordControl!"
        type="password"
        placeholder="••••••••••••••"
        [label]="'auth.confirmPassword' | translate"
        [errorMessage]="
          confirmPasswordControl?.touched && confirmPasswordControl?.hasError('required')
            ? ('validation.required' | translate)
            : undefined
        "
      ></app-input>
    </div>

    <div class="form-group">
      <app-input
        [formControl]="codeControl!"
        type="text"
        placeholder="32423"
        [label]="'auth.code' | translate"
        [errorMessage]="
          codeControl?.touched && codeControl?.hasError('required')
            ? ('validation.required' | translate)
            : undefined
        "
      ></app-input>
    </div>

    <div class="button-section">
      <app-button
        variant="primary"
        type="submit"
        [fullWidth]="true"
        [disabled]="!form.valid"
      >
        {{ 'auth.login' | translate }}
      </app-button>
    </div>
  </form>
</div>
