<div class="reset-page">
  <!-- Back Button -->
  <button class="back-btn" (click)="goBack()" aria-label="Go back">
    <lucide-angular [img]="ChevronLeftIcon" [size]="24"></lucide-angular>
  </button>

  <!-- Title -->
  <h1 class="page-title">Reset password</h1>
  <p class="page-subtitle">You will receive a code to reset your password.</p>

  <!-- Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-section">
    <div class="form-group">
      <app-input
        [formControl]="passwordControl!"
        type="password"
        placeholder="••••••••••••••"
        label="Password"
        [errorMessage]="
          passwordControl?.touched && passwordControl?.hasError('required')
            ? 'Password is required'
            : passwordControl?.touched && passwordControl?.hasError('minlength')
              ? 'Password must be at least 8 characters'
              : undefined
        "
      ></app-input>
    </div>

    <div class="form-group">
      <app-input
        [formControl]="confirmPasswordControl!"
        type="password"
        placeholder="••••••••••••••"
        label="Confirm Password"
        [errorMessage]="
          confirmPasswordControl?.touched && confirmPasswordControl?.hasError('required')
            ? 'Please confirm your password'
            : undefined
        "
      ></app-input>
    </div>

    <div class="form-group">
      <app-input
        [formControl]="codeControl!"
        type="text"
        placeholder="32423"
        label="Code"
        [errorMessage]="
          codeControl?.touched && codeControl?.hasError('required')
            ? 'Code is required'
            : undefined
        "
      ></app-input>
    </div>

    <div class="button-section">
      <app-button
        variant="primary"
        type="submit"
        [fullWidth]="true"
        [disabled]="!form.valid"
      >
        Login
      </app-button>
    </div>
  </form>
</div>
